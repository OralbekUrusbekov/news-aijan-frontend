name: Frontend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/oralbekurusbekov/news-aijan-frontend

jobs:
  deploy-production:
    runs-on: self-hosted
    if: github.ref_name == 'main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --no-cache \
            --build-arg NEXT_BASE_PATH="/portal" \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy
        run: |
          docker stop news-aijan-frontend 2>/dev/null || true
          docker rm news-aijan-frontend 2>/dev/null || true
          docker run -d --name news-aijan-frontend --restart unless-stopped -p 8083:3000 \
            ${{ env.IMAGE_NAME }}:latest

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8083/portal/; then
              echo "Frontend is up (attempt $i)"
              exit 0
            fi
            echo "Waiting for frontend to become ready... ($i/15)"
            sleep 3
          done
          docker logs news-aijan-frontend --tail 80
          echo "Frontend did not become ready in time" >&2
          exit 1

  deploy-staging:
    runs-on: self-hosted
    if: github.ref_name == 'dev' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --no-cache -t ${{ env.IMAGE_NAME }}:dev .

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_NAME }}:dev

      - name: Deploy
        run: |
          docker stop news-aijan-frontend-dev 2>/dev/null || true
          docker rm news-aijan-frontend-dev 2>/dev/null || true
          docker run -d --name news-aijan-frontend-dev --restart unless-stopped -p 8082:3000 \
            ${{ env.IMAGE_NAME }}:dev

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8082/; then
              echo "Frontend is up (attempt $i)"
              exit 0
            fi
            echo "Waiting for frontend to become ready... ($i/15)"
            sleep 3
          done
          docker logs news-aijan-frontend-dev --tail 80
          echo "Frontend did not become ready in time" >&2
          exit 1

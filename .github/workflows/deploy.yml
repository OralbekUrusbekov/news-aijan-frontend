name: Frontend CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/oralbekurusbekov/news-aijan-frontend

jobs:
  deploy-production:
    runs-on: self-hosted
    if: github.ref_name == 'main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.news-aijan.kz/api' }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy
        run: |
          docker stop news-aijan-frontend 2>/dev/null || true
          docker rm news-aijan-frontend 2>/dev/null || true
          docker run -d --name news-aijan-frontend --restart unless-stopped -p 8081:3000 \
            ${{ env.IMAGE_NAME }}:latest
          sleep 2
          docker ps | grep news-aijan-frontend

  deploy-staging:
    runs-on: self-hosted
    if: github.ref_name == 'dev' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING || 'https://staging-api.news-aijan.kz/api' }} \
            -t ${{ env.IMAGE_NAME }}:dev .

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_NAME }}:dev

      - name: Deploy
        run: |
          docker stop news-aijan-frontend-dev 2>/dev/null || true
          docker rm news-aijan-frontend-dev 2>/dev/null || true
          docker run -d --name news-aijan-frontend-dev --restart unless-stopped -p 8082:3000 \
            ${{ env.IMAGE_NAME }}:dev
          sleep 2
          docker ps | grep news-aijan-frontend-dev
